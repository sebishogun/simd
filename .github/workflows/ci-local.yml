name: ci

# Deliberately small. Everything this project needs to verify is verifiable on
# the machine the runner is on, with `make verify`, `make test-cross` and
# `make bench-check`, and those are the commands actually being run during
# development. Duplicating them here would buy a badge and cost twenty minutes
# of a single self-hosted runner per push, serialised, on a box that is also
# the development machine — and the benchmark gate in particular measures its
# neighbours, so running it beside anything else makes it lie.
#
# What survives is the part that is cheap and that a person genuinely does
# forget: formatting, vet, the static assertions on the committed assembly, and
# the test suite. Under a minute, and it catches the mistakes that get pushed.
#
# The rest is a `workflow_dispatch` away when this repository goes public and
# there is a reason for a third party to see the matrix go green:
#
#   make verify        # + purego and every tier this CPU can run
#   make test-cross    # arm64, s390x, ppc64le under docker + qemu
#   make test-riscv64  # and test-loong64
#   make test-gates    # a CPU that LACKS the vector extension — the mis-gate case
#   make bench-check   # against the stored baseline
#   make fuzz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: build, vet and test
    # This runner is a development machine, not a disposable container, and the
    # repository is public. Without this condition any stranger could open a
    # pull request from a fork and have its code — makefiles, test files, go
    # generate directives — execute here as the user who owns the box. GitHub's
    # default only holds *first-time* contributors for approval, so one merged
    # trivial PR is enough to earn unattended execution afterwards.
    #
    # So forks never reach this runner. A pull request from a branch in this
    # repository still does, which is the case the gate is for; a fork gets the
    # same coverage from hosted-ci.yml, which runs on GitHub's disposable
    # machines where untrusted code belongs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: formatting
        run: |
          out=$(gofmt -l . | grep -v '^tools/goat/' || true)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: vet
        run: |
          go vet ./...
          cd tools && go vet ./...

      # The static assertions on the committed assembly. No toolchain, no
      # emulation — it parses text — so it is nearly free and catches the class
      # of bug that only shows up at run time on one architecture.
      - name: assembly invariants
        run: go test ./internal/asmcheck/

      - name: tests
        run: go test ./...
