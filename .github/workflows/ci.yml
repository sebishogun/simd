name: CI

# Parked. Hosted runners are not available on this account, so every job here
# fails in zero seconds with "workflow file issue" — which is what it looks
# like from the outside when Actions has no minutes. The live gate is
# ci-local.yml, which runs the same checks on the self-hosted runner.
#
# This file is kept rather than deleted because it is the configuration that
# should run if hosted minutes are ever available: the matrix over Go versions
# and operating systems is something one local machine cannot provide.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is a native arm64 runner, so NEON and any SVE2 it
        # exposes are exercised for real rather than under emulation.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: report selected tier
        run: go run ./cmd/simdinfo

  purego:
    name: portable Go only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      # The reference must be self-consistent before anything is compared
      # against it.
      - run: go test -tags purego ./...

  tiers:
    name: every instruction-set tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      # Runs the suite once per tier this runner can execute. This is what
      # catches a kernel that is right on AVX-512 and wrong on SSE2.
      - run: make test-tiers

  emission:
    name: gate matches emitted instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      # Asserts no generated .s contains an instruction requiring a CPU
      # feature above the tier its file is gated on. This is the check that
      # mechanically prevents the SIGILL class of bug that every comparable
      # library has shipped; see docs/research/05-decisions.md, D7.
      #
      # Skipped until the code-generation pipeline lands and there is
      # generated assembly to inspect.
      - run: test -d internal/amd64 && make check-emission || echo "no generated assembly yet"

  fmt:
    name: gofmt and tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: make fmt-check
      - run: go mod tidy && git diff --exit-code go.mod go.sum

  # This lane is not extra assurance. Every memory-corruption bug this library
  # has had passed a green amd64 suite and was caught only here:
  #
  #   - kernels using the register the Go runtime keeps the current goroutine
  #     in, which clang has no flag to reserve on three of the six targets;
  #   - kernels writing into the caller's frame through a register save area
  #     that the s390x ABI expects the caller to provide;
  #   - a reference that computed different bits wherever Go fuses a multiply
  #     into an add, which is everywhere except amd64;
  #   - a float argument consuming an integer register slot under ELFv2.
  #
  # arm64 runs on every pull request because it is the second-most-used
  # architecture and cheap enough; the rest run nightly.
  #
  # -short skips the repetition benchmarks, which measure a minimum over many
  # runs and mean nothing under emulation.
  cross:
    name: cross-architecture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # riscv64 is not here. Its image exists, but the qemu inside it
        # emulates a CPU with no vector extension, so the whole RVV backend is
        # skipped as unexecutable and the lane passes having run none of it.
        # It is tested by the qemu job below instead.
        platform: [linux/arm64, linux/s390x, linux/ppc64le]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      # The gate is on the step rather than the job: a job-level `if` cannot
      # see `matrix`, so putting it there would silently disable the whole lane.
      - name: test under emulation
        if: >-
          github.event_name == 'schedule' || github.event_name == 'push' ||
          matrix.platform == 'linux/arm64'
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src -w /src -e GOFLAGS=-buildvcs=false golang:1.26 \
            sh -c 'go run ./cmd/simdinfo -require-accelerated && go test -short ./...'

  # Benchmarks as a gate rather than as a report.
  #
  # Every performance number in this repository was measured once by hand,
  # which is how they were arrived at honestly and also how they rot: a rewrite
  # that costs 30% looks exactly like one that costs nothing until somebody
  # re-runs the benchmark and remembers what it used to say.
  #
  # This runs on the self-hosted runner because a benchmark on a shared hosted
  # machine measures the neighbours. The threshold is deliberately wide — 25%,
  # against a run-to-run spread of 1-3% here — because the job is to block a
  # real regression, not to police noise.
  bench:
    name: benchmarks against the baseline
    runs-on: [self-hosted, linux]
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make bench-check

  # Fuzzing on a budget. The differential fuzzer drives every kernel of every
  # tier against the portable reference with the fuzzer choosing the bit
  # patterns, which is the only thing that reaches a signalling NaN or a
  # denormal at an exact exponent boundary. It found a wrong answer in CountAny
  # that no table of inputs had.
  fuzz:
    name: differential fuzzing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make fuzz FUZZTIME=300s

  # The two architectures the docker matrix cannot test, for two different
  # reasons. loong64 has no golang image at all; riscv64 has one whose emulated
  # CPU has no vector extension. Both are cross-compiled here and run under a
  # recent qemu-user directly, which works because Go binaries are static.
  #
  # Both were green for months while executing nothing, which is why every lane
  # now runs `simdinfo -require-accelerated` first. The first run that actually
  # executed them found a segfault on one — clang using r22, the register the
  # Go runtime keeps the current goroutine in, in 616 places, past a check that
  # was looking for the wrong spelling of it — and, on the other, every kernel
  # that reads a constant reading it from four bytes before the function.
  qemu:
    name: ${{ matrix.arch }} under qemu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: loong64
            qemu: qemu-loongarch64
          - arch: riscv64
            qemu: qemu-riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The image's own qemu is too old: LSX and LASX arrived in QEMU 8.1.
      - name: fetch a recent ${{ matrix.qemu }}
        run: |
          cid=$(docker create tonistiigi/binfmt:latest)
          docker cp "$cid":/usr/bin/${{ matrix.qemu }} /usr/local/bin/
          docker rm "$cid"
          ${{ matrix.qemu }} -version | head -1
      - run: make test-${{ matrix.arch }}

  # Scalable vector ISAs have a runtime-variable vector length, so a kernel can
  # be correct at one width and wrong at another. Testing a single width proves
  # very little; these lanes sweep the range QEMU can emulate.
  sve-widths:
    name: SVE2 at VL=${{ matrix.vl }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        vl: [128, 256, 512, 1024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: build and run the suite at a fixed vector length
        run: |
          GOOS=linux GOARCH=arm64 go test -c -o /tmp/simd.test ./
          qemu-aarch64 -cpu max,sve${{ matrix.vl }}=on -L /usr/aarch64-linux-gnu /tmp/simd.test -test.v

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: make fuzz FUZZTIME=10m
